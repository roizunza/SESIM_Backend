# Overlay de SESIM sobre la infraestructura vendorizada de Supabase. Se usa
# "include" (no "-f infra/supabase/docker-compose.yml ...") a proposito:
#
# Con "-f archivoA -f archivoB", docker compose fija UN SOLO directorio de
# proyecto para TODAS las rutas relativas de AMBOS archivos (por defecto,
# la carpeta del primer -f; forzarlo con --project-directory tampoco sirve,
# porque entonces pasa lo mismo pero al reves). El resultado es que las
# rutas relativas de infra/supabase/docker-compose.yml (por ejemplo
# "./volumes/api/envoy/...") y las de este archivo (por ejemplo "./db")
# NO PUEDEN estar ambas bien resueltas al mismo tiempo -- una de las dos
# se rompe. Esto se detecto en la practica: "docker compose up" fallaba al
# montar infra/supabase/volumes/api/envoy/docker-entrypoint.sh porque se
# buscaba en la raiz del repo en vez de dentro de infra/supabase/.
#
# "include" evita el problema de raiz: cada archivo incluido resuelve SUS
# PROPIAS rutas relativas contra SU PROPIA carpeta, sin importar desde
# donde se invoque "docker compose". Por eso este archivo (y no
# infra/supabase/docker-compose.yml) es el que se pasa con -f -- ver
# README.md, seccion "Como levantar el entorno", o simplemente:
#
#   ./scripts/levantar.sh
#
# Aqui solo se agrega/ajusta lo propio de SESIM:
#   - servicio "db": se construye con nuestra imagen (db/Dockerfile), que
#     extiende la imagen oficial de Supabase y le agrega las migraciones de
#     SESIM.
#   - servicio "servicio-procesos": propio de SESIM (ver ese directorio).
#   - servicio "mailpit": correo de prueba para desarrollo. El servicio
#     "auth" (GoTrue) de Supabase se apunta aqui en vez de a un SMTP real,
#     mientras no haya contrasena de aplicacion de Gmail (ver
#     docs/decisiones-pendientes.md).

# AMBIENTES (Ciclo 2): un solo compose para los tres ambientes (desarrollo,
# pruebas, produccion). Lo que cambia entre ellos NO esta en este archivo
# sino en el .env de cada ambiente (env/<ambiente>.env.example): puertos,
# direccion en la que escucha Postgres, correo (SMTP) y si se levanta el
# buzon de prueba (perfil "correo-prueba", solo desarrollo y pruebas).
# Se usa asi a proposito, en vez de archivos override por ambiente: no hay
# fusion de archivos que pueda romperse. Ver scripts/levantar.sh y
# docs/ambientes.md.
#
# LIMITE CONOCIDO: infra/supabase fija nombres de contenedor
# (container_name: supabase-db, supabase-auth, ...) y la carpeta de datos de
# Postgres, y no se edita (ver infra/VENDOR.md). Por eso hay UN ambiente por
# maquina/servidor: desarrollo en la laptop, pruebas y produccion en su
# servidor. No se pueden levantar dos ambientes a la vez en el mismo equipo.

include:
  - path: infra/supabase/docker-compose.yml

services:
  db:
    build: ./db
    restart: unless-stopped
    ports:
      # Postgres escucha solo en la direccion DB_BIND_ADDR (por defecto
      # 127.0.0.1: unicamente desde el propio equipo, para psql/DBeaver por
      # tunel SSH). Nunca poner 0.0.0.0 en pruebas ni produccion.
      - "${DB_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  auth:
    environment:
      # OJO: las variables de contenedor que de verdad lee GoTrue llevan el
      # prefijo GOTRUE_ (el .env.example de infra/supabase usa nombres sin
      # prefijo como ${SMTP_HOST} solo como ATAJO para rellenar estas
      # mismas variables -- pero como aqui las sobreescribimos directo en
      # el compose, hay que usar el nombre real que ve GoTrue).
      # En desarrollo y pruebas apuntan a Mailpit (valores por defecto); en
      # produccion se definen SMTP_HOST/PORT/USER/PASS en .env (SMTP
      # institucional) -- ver env/produccion.env.example.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-SESIM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@sesim.local}
      # Custom Access Token Hook: agrega el rol de core.perfil como claim de
      # CONVENIENCIA en el JWT (para que el front lo lea directo, sin la
      # consulta extra a api.perfil). No cambia la autorizacion real -- ver
      # el comentario completo en
      # db/migrations/108_hook_custom_access_token.sql. No se configura
      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_SECRETS: es para hooks HTTP propios,
      # no para "pg-functions://" como este.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/core/custom_access_token_hook"

  servicio-procesos:
    build: ./servicio-procesos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      GOTRUE_INTERNAL_URL: http://auth:9999
      # Nombre del ambiente: lo devuelve GET /health y bloquea las semillas
      # de desarrollo en produccion.
      APP_ENV: ${APP_ENV:-desarrollo}
    ports:
      - "${PROCESOS_BIND_ADDR:-127.0.0.1}:${PROCESOS_PORT:-8001}:8000"

  mailpit:
    image: axllent/mailpit:latest
    # Solo desarrollo y pruebas: scripts/levantar.sh lo activa con
    # --profile correo-prueba. En produccion NO existe.
    profiles: ["correo-prueba"]
    ports:
      - "127.0.0.1:8025:8025" # interfaz web para ver los correos capturados
      - "127.0.0.1:1025:1025" # puerto SMTP que usa GoTrue (servicio "auth")
